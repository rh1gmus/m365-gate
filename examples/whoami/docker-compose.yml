# Smallest possible consumer: put a tiny echo server behind m365-gate.
# It shows the X-Forwarded-Email / -User / -Preferred-Username headers the gate passes to apps.
#
#   cd examples/whoami
#   cp ../../.env.example .env      # set GATE_UPSTREAM=http://whoami:80 and fill in the rest
#   docker compose up -d
include:
  - path: ../../compose.yaml
    env_file: ./.env

services:
  whoami:
    image: traefik/whoami:v1.10.3@sha256:43a68d10b9dfcfc3ffbfe4dd42100dc9aeaf29b3a5636c856337a5940f1b4f1c
    restart: unless-stopped
    networks: [gate_backend]
