# Builds the Caddy + Cloudflare DNS image and publishes it to GitHub Container Registry,
# so new hosts pull it in seconds instead of compiling Caddy (~12 min on 1 vCPU).
# Uses the repo's built-in GITHUB_TOKEN. No personal access token is needed.
name: caddy-image

on:
  push:
    branches: [main]
    paths:
      - caddy/Dockerfile
      - .github/workflows/caddy-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CADDY_VERSION: "2.10.2"
  CF_DNS_VERSION: "0.2.4"
  IMAGE: ghcr.io/${{ github.repository_owner }}/m365-gate-caddy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: caddy
          platforms: linux/amd64
          push: true
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            CF_DNS_VERSION=${{ env.CF_DNS_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.CADDY_VERSION }}-cloudflare${{ env.CF_DNS_VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
