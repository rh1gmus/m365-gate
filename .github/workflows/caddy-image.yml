# Builds the Caddy + Cloudflare DNS image and publishes it to GitHub Container Registry,
# so new hosts pull it in seconds instead of compiling Caddy (~12 min on 1 vCPU).
# Uses the repo's built-in GITHUB_TOKEN. No personal access token is needed.
#
# Supply chain: every action is pinned to a commit SHA (the comment names the release),
# the image is pushed with a BuildKit provenance and SBOM attestation, and the run summary
# prints the image digest to pin in compose.yaml. There is no floating :latest tag.
name: caddy-image

on:
  push:
    branches: [main]
    paths:
      - caddy/Dockerfile
      - .github/workflows/caddy-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CADDY_VERSION: "2.11.9"
  CF_DNS_VERSION: "0.2.4"
  # Bump when the Dockerfile changes without a version bump, so a new tag is published and old digests stay valid.
  IMAGE_REV: "r1"
  IMAGE: ghcr.io/${{ github.repository_owner }}/m365-gate-caddy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: caddy
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            CADDY_VERSION=${{ env.CADDY_VERSION }}
            CF_DNS_VERSION=${{ env.CF_DNS_VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.CADDY_VERSION }}-cloudflare${{ env.CF_DNS_VERSION }}-${{ env.IMAGE_REV }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Print the digest to pin
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Pin in compose.yaml: ${IMAGE}:${CADDY_VERSION}-cloudflare${CF_DNS_VERSION}-${IMAGE_REV}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
