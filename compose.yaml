# m365-gate: Microsoft 365 / Entra ID sign-in + HTTPS in front of any HTTP app.
#
#   browser --HTTPS :GATE_PORT--> gate-caddy --> gate-proxy (oauth2-proxy) --> GATE_UPSTREAM
#
# Use it from a project's docker-compose.yml:
#
#   include:
#     - path: ./m365-gate/compose.yaml
#       env_file: ./.env
#   services:
#     app:
#       ...
#       networks: [gate_backend]   # don't publish the app's port
#
# Every value comes from the consuming project's .env (see .env.example).
# Don't share the output of `docker compose config`. It prints the resolved secrets.

services:
  gate-caddy:
    labels:
      env: test
    # TODO(pin): add @sha256:<digest> from the caddy-image run summary once CI has built the -r2 tag, then audit it
    # (README "Updating pins"). Until then this image is NOT pinned. Do not merge this branch before that.
    image: ${GATE_CADDY_IMAGE:-ghcr.io/rh1gmus/m365-gate-caddy:2.10.2-cloudflare0.2.4-r2}
    build: ./caddy            # fallback when the image can't be pulled (about 12 min on 1 vCPU)
    restart: unless-stopped
    # Non-root, no capabilities. The image's binary has no file capability (see caddy/Dockerfile), and port <1024
    # works through the sysctl below.
    user: "65532:65532"
    read_only: true
    tmpfs: ["/tmp"]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "${GATE_BIND:-0.0.0.0}:${GATE_PORT:-443}:${GATE_PORT:-443}"
    environment:
      GATE_HOST: ${GATE_HOST:?set GATE_HOST in .env}
      GATE_PORT: ${GATE_PORT:-443}
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?set CF_DNS_API_TOKEN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - gate_caddy_data:/data         # certificates; keep this so restarts don't re-issue
      - gate_caddy_config:/config
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [gate_edge]
    depends_on:
      gate-proxy:
        condition: service_started
      gate-caddy-perms:
        condition: service_completed_successfully

  # One-shot, as root with only CHOWN: hands the certificate and config volumes to the non-root Caddy user.
  # Older installs have them owned by root; this is a no-op once they are correct. No network.
  gate-caddy-perms:
    labels:
      env: test
    image: ${GATE_CADDY_IMAGE:-ghcr.io/rh1gmus/m365-gate-caddy:2.10.2-cloudflare0.2.4-r2}
    restart: "no"
    user: "0:0"
    command:
      - sh
      - -c
      - 'for d in /data /config; do [ "$$(stat -c %u $$d)" = 65532 ] || chown -R 65532:65532 $$d; done'
    volumes:
      - gate_caddy_data:/data
      - gate_caddy_config:/config
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]

  gate-config:
    labels:
      env: test
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    restart: "no"
    command: ["python", "-I", "/render_config.py"]
    environment:
      GATE_HOST: ${GATE_HOST:?set GATE_HOST in .env}
      GATE_PORT: ${GATE_PORT:-443}
      GATE_UPSTREAM: ${GATE_UPSTREAM:?set GATE_UPSTREAM in .env, e.g. http://app:8080}
      GATE_SESSION_HOURS: ${GATE_SESSION_HOURS:-12}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID in .env}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ALLOWED_GROUPS: ${ALLOWED_GROUPS:-}
    volumes:
      - ./config/render_config.py:/render_config.py:ro
      - gate_config:/config
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  gate-proxy:
    labels:
      env: test
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0@sha256:786bed0f000c0f8a7b31619244ebab02406a8856a4faf3f5fb1df61fbd6c30ed
    restart: unless-stopped
    command: ["--config=/config/oauth2-proxy.cfg"]
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${ENTRA_CLIENT_ID:?set ENTRA_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:?set ENTRA_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}
    volumes:
      - gate_config:/config:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [gate_edge, gate_backend]
    depends_on:
      gate-config:
        condition: service_completed_successfully

networks:
  gate_edge: {}
  gate_backend:
    internal: true   # no internet and no host ports; only gate-proxy reaches the app

volumes:
  gate_caddy_data: {}
  gate_caddy_config: {}
  gate_config: {}
